<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TrialShield</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header class="topbar">
        <div>
          <h1>TrialShield</h1>
          <p class="subtitle">Trial risk, protection, and evidence in one flow.</p>
        </div>
        <span id="risk-pill" class="risk-pill muted">—</span>
      </header>

      <section id="monitor" class="card compact">
        <div class="section-head">
          <h2>Live page</h2>
          <span id="monitor-status" class="monitor-status">
            <span id="monitor-dot" class="dot dot-idle" aria-hidden="true"></span>
            <span id="monitor-status-text">Idle</span>
          </span>
        </div>

        <p id="monitor-page-type" class="current-page">Current page: —</p>

        <div class="signal-grid">
          <div>
            <span>Trial</span>
            <strong id="monitor-trial">—</strong>
          </div>
          <div>
            <span>Payment</span>
            <strong id="monitor-payment">—</strong>
          </div>
          <div>
            <span>Renewal</span>
            <strong id="monitor-renewal">—</strong>
          </div>
          <div>
            <span>Cancel</span>
            <strong id="monitor-cancellation">—</strong>
          </div>
        </div>

        <ul id="monitor-alerts" class="alerts" aria-live="polite"></ul>
        <p id="monitor-plan" class="minor-line">Plan: unknown</p>
        <p id="monitor-lastscan" class="minor-line"></p>
      </section>

      <form id="search-form" class="card compact" role="search">
        <label for="search-input">Find trial pages</label>
        <div class="search-row">
          <input
            id="search-input"
            type="search"
            placeholder="music, design, fitness..."
            autocomplete="off"
          />
          <button type="submit">Search</button>
        </div>
        <p id="result-count" class="status" aria-live="polite"></p>
        <ul id="results" class="results"></ul>
      </form>

      <section id="trial-details" class="card" hidden>
        <div class="section-head">
          <h2>Analysis</h2>
          <span id="analysis-score" class="score-text">Scanning…</span>
        </div>

        <p id="analysis-status" class="status">Analyzing page…</p>

        <div id="summary-grid" class="summary-grid"></div>
        <ul id="warning-list" class="warning-list"></ul>

        <div class="action-row">
          <button id="protect-trial" class="protect-button" type="button" hidden>
            Protect
          </button>
          <button id="cancel-trial" class="danger-button" type="button" hidden>
            Auto-cancel
          </button>
        </div>

        <p id="protection-status" class="status" aria-live="polite"></p>

        <details id="technical-details" class="technical-details">
          <summary>Evidence and technical details</summary>
          <dl id="details-list"></dl>
        </details>

        <section id="audit-panel" class="audit-panel" hidden>
          <h2>Evidence log</h2>
          <ul id="audit-list" class="audit-list"></ul>
        </section>
      </section>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
